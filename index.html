<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الكرادة للمراسلة</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #0d1117;
      color: #ffffff;
      direction: rtl;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #1f6feb;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #fff;
      position: relative;
    }
    .logout-btn {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.3s;
    }
    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }
    #messages {
      background: #161b22;
      padding: 15px;
      overflow-y: auto;
      border-radius: 15px;
      border: 1px solid #30363d;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
      margin-bottom: 10px;
    }
    .message-container {
      display: flex;
    }
    .message-container.sent {
      justify-content: flex-end;
    }
    .message-container.received {
      justify-content: flex-start;
    }
    .message-bubble {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 18px;
      position: relative;
      word-wrap: break-word;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .message-bubble.sent {
      background: linear-gradient(135deg, #238636 0%, #2ea043 100%);
      color: white;
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 6px;
    }
    .message-bubble.received {
      background: linear-gradient(135deg, #21262d 0%, #30363d 100%);
      color: #f0f6fc;
      border-bottom-left-radius: 6px;
      border-bottom-right-radius: 18px;
    }
    .message-text {
      font-size: 14px;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .message-time {
      font-size: 11px;
      opacity: 0.7;
      text-align: left;
      margin-top: 4px;
    }
    .message-bubble.sent .message-time {
      text-align: right;
    }
    .user-info {
      font-size: 11px;
      opacity: 0.8;
      margin-bottom: 2px;
      font-weight: 500;
    }
    .message-bubble.received .user-info {
      color: #58a6ff;
    }
    .input-container {
      display: flex;
      gap: 10px;
      align-items: center;
      padding-top: 10px;
    }
    #messageInput {
      flex: 1;
      padding: 12px 16px;
      border-radius: 25px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.3s, background 0.3s;
    }
    #messageInput:focus {
      border-color: #58a6ff;
      background: #0d1117;
    }
    .send-btn {
      background: #1f6feb;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: background 0.3s;
    }
    .send-btn:hover {
      background: #0969da;
    }
    footer {
      text-align: center;
      font-size: 13px;
      padding: 10px;
      background: #0d1117;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>
    📨 الكرادة للمراسلة
    <button class="logout-btn" onclick="logout()" style="display:none" id="logoutBtn">
      🚪 خروج
    </button>
  </header>
  <main>
    <div id="auth">
      <input id="email" placeholder="البريد الإلكتروني" />
      <input id="password" type="password" placeholder="كلمة المرور" />
      <button onclick="signIn()">تسجيل الدخول</button>
      <button onclick="signUp()">إنشاء حساب</button>
    </div>
    <div id="chat" style="display:none; flex-direction: column; height: 100%;">
      <div class="welcome-message">
        <p>مرحباً، <span id="userEmail"></span>! 👋</p>
      </div>
      <div id="messages"></div>
      <div class="input-container">
        <input id="messageInput" placeholder="اكتب رسالة..." onkeypress="handleKeyPress(event)" />
        <button class="send-btn" onclick="sendMessage()" id="sendBtn">إرسال</button>
      </div>
    </div>
  </main>
  <footer>
    الموقع آمن بالكامل ويخضع للتشفير التام. تصميم وتنفيذ: raad alaswed © 2025
  </footer>
  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
    const supabase = createClient(
      'https://xbvtkpqoxldrxzrvwhqf.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhidnRrcHFveGxkcnh6cnZ3aHFmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ2NzcyMzksImV4cCI6MjA3MDI1MzIzOX0.D1oax46qsWrNzOFIGvyuXQj0VuO_7VOY5ev_hCiM2Zc'
    );

    let currentUser = null;
    let messagesLoaded = false;

    async function signIn() {
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const { data, error } = await supabase.auth.signInWithPassword({ email: email.value, password: password.value });
      if (error) return alert(error.message);
      currentUser = data.user;
      showChat();
    }

    async function signUp() {
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const { error } = await supabase.auth.signUp({ email: email.value, password: password.value });
      if (error) return alert(error.message);
      alert('تم إنشاء الحساب، قم بتسجيل الدخول.');
    }

    async function logout() {
      await supabase.auth.signOut();
      location.reload();
    }

    async function sendMessage() {
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const text = messageInput.value.trim();
      if (!text) return;
      sendBtn.disabled = true;
      sendBtn.textContent = 'جاري الإرسال...';
      try {
        const { error } = await supabase.from('messages').insert({ content: text, user_id: currentUser.id });
        if (error) throw error;
        messageInput.value = '';
      } catch (error) {
        alert('حدث خطأ في إرسال الرسالة');
        console.error(error);
      } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = 'إرسال';
      }
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') sendMessage();
    }

    async function loadMessages() {
      const { data, error } = await supabase.from('messages').select('content, user_id, created_at').order('created_at', { ascending: true });
      if (error) return console.error('خطأ في تحميل الرسائل:', error);
      const messagesContainer = document.getElementById('messages');
      messagesContainer.innerHTML = '';
      data.forEach(msg => addMessageToUI(msg));
      scrollToBottom();
    }

    function addMessageToUI(message) {
      const messagesContainer = document.getElementById('messages');
      const messageContainer = document.createElement('div');
      const isSent = message.user_id === currentUser.id;
      messageContainer.className = 'message-container ' + (isSent ? 'sent' : 'received');
      const messageBubble = document.createElement('div');
      messageBubble.className = 'message-bubble ' + (isSent ? 'sent' : 'received');
      let messageTime = 'الآن';
      if (message.created_at) {
        try {
          messageTime = new Date(message.created_at).toLocaleTimeString('ar-IQ', { hour: '2-digit', minute: '2-digit' });
        } catch (e) {}
      }
      messageBubble.innerHTML = `
        ${!isSent ? `<div class="user-info">${message.user_id}</div>` : ''}
        <div class="message-text">${message.content}</div>
        <div class="message-time">${messageTime}</div>
      `;
      messageContainer.appendChild(messageBubble);
      messagesContainer.appendChild(messageContainer);
      scrollToBottom();
    }

    function scrollToBottom() {
      const messagesContainer = document.getElementById('messages');
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function showChat() {
      document.getElementById('auth').style.display = 'none';
      document.getElementById('chat').style.display = 'flex';
      document.getElementById('logoutBtn').style.display = 'block';
      document.getElementById('userEmail').textContent = currentUser.email;
      loadMessages();
      messagesLoaded = true;
      supabase.channel('public:messages').on('postgres_changes', {
        event: '*', schema: 'public', table: 'messages'
      }, (payload) => {
        if (payload.eventType === 'INSERT') {
          addMessageToUI(payload.new);
        } else {
          loadMessages();
        }
      }).subscribe();
    }

    supabase.auth.getUser().then(({ data }) => {
      if (data.user) {
        currentUser = data.user;
        showChat();
      }
    });

    window.signIn = signIn;
    window.signUp = signUp;
    window.logout = logout;
    window.sendMessage = sendMessage;
    window.handleKeyPress = handleKeyPress;

  </script>
</body>
</html>
