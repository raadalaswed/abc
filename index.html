<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الكرادة للمراسلة - ستايل تيليجرام</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Segoe+UI&display=swap');

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background: #e5e5e5;
      color: #202c33;
      direction: rtl;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      background: #0088cc;
      padding: 15px 25px;
      text-align: center;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      position: relative;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
      user-select: none;
      letter-spacing: 1.2px;
    }
    .logout-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255 255 255 / 0.25);
      border: none;
      color: white;
      padding: 8px 14px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.25s ease;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
    .logout-btn:hover {
      background: rgba(255 255 255 / 0.4);
    }
    .logout-btn svg {
      width: 16px;
      height: 16px;
      fill: white;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 25px 20px;
      max-width: 600px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      margin-top: 25px;
      margin-bottom: 25px;
    }

    #messages {
      background: #f8f9fa;
      padding: 20px;
      overflow-y: auto;
      border-radius: 15px;
      border: 1px solid #d0d7de;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      margin-bottom: 15px;
      scrollbar-width: thin;
      scrollbar-color: #a0aec0 transparent;
      animation: fadeInUp 0.3s ease forwards;
    }
    #messages::-webkit-scrollbar {
      width: 8px;
    }
    #messages::-webkit-scrollbar-track {
      background: transparent;
    }
    #messages::-webkit-scrollbar-thumb {
      background-color: #a0aec0;
      border-radius: 4px;
    }

    .message-container {
      display: flex;
      opacity: 0;
      animation: fadeInRight 0.35s forwards;
      animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
    }
    .message-container.sent {
      justify-content: flex-end;
      animation-name: fadeInLeft;
    }
    .message-bubble {
      max-width: 70%;
      padding: 14px 18px;
      border-radius: 20px;
      position: relative;
      word-wrap: break-word;
      font-size: 15px;
      line-height: 1.5;
      box-shadow: 0 1px 4px rgb(0 0 0 / 0.1);
      user-select: text;
      transition: background 0.3s ease;
      color: #202c33;
    }
    .message-bubble.sent {
      background: #dcf8c6;
      border-bottom-right-radius: 4px;
      color: #262626;
      box-shadow: 0 1px 5px rgb(35 150 86 / 0.3);
    }
    .message-bubble.received {
      background: white;
      border-bottom-left-radius: 4px;
      color: #202c33;
    }

    .message-time {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
      text-align: left;
      opacity: 0.7;
    }
    .message-bubble.sent .message-time {
      text-align: right;
    }
    .user-info {
      font-size: 12px;
      color: #0088cc;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input-container {
      display: flex;
      gap: 12px;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid #d0d7de;
    }
    #messageInput {
      flex: 1;
      padding: 12px 18px;
      border-radius: 30px;
      border: 1px solid #ccc;
      background: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.25s ease;
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.1);
      color: #202c33;
      font-weight: 500;
    }
    #messageInput::placeholder {
      color: #999;
      font-weight: 400;
    }
    #messageInput:focus {
      border-color: #0088cc;
      box-shadow: 0 0 8px rgba(0, 136, 204, 0.4);
    }

    .send-btn {
      background: #0088cc;
      color: white;
      border: none;
      padding: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
      box-shadow: 0 2px 6px rgba(0, 136, 204, 0.5);
    }
    .send-btn:hover {
      background: #007ab8;
      box-shadow: 0 4px 10px rgba(0, 122, 184, 0.7);
    }
    .send-btn svg {
      fill: white;
      width: 20px;
      height: 20px;
      transform: rotate(45deg);
    }

    /* Auth inputs and buttons style */
    #auth {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }
    #auth input {
      padding: 12px 16px;
      font-size: 15px;
      border-radius: 30px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.25s ease;
    }
    #auth input:focus {
      border-color: #0088cc;
      box-shadow: 0 0 8px rgba(0, 136, 204, 0.3);
    }
    #auth button {
      background: #0088cc;
      border: none;
      color: white;
      padding: 12px;
      font-weight: 600;
      font-size: 16px;
      border-radius: 30px;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    #auth button:hover {
      background: #007ab8;
    }

    .welcome-message {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 15px;
      color: #202c33;
    }

    footer {
      text-align: center;
      font-size: 13px;
      padding: 14px 10px;
      background: #f1f3f5;
      color: #666;
      user-select: none;
      border-top: 1px solid #ddd;
      max-width: 600px;
      margin: 0 auto 20px;
      border-radius: 12px;
    }

    /* Animations */
    @keyframes fadeInRight {
      0% {
        opacity: 0;
        transform: translateX(20px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes fadeInLeft {
      0% {
        opacity: 0;
        transform: translateX(-20px);
      }
      100% {
        opacity: 1;
        transform: translateX(0);
      }
    }
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <header>
    📨 الكرادة للمراسلة
    <button class="logout-btn" onclick="logout()" style="display:none" id="logoutBtn" aria-label="خروج">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5v10zM19 19H9v-2h10v-10H9V5h10c1.1 0 2 .9 2 2v10c0 1.1-.9 2-2 2z"/></svg>
      خروج
    </button>
  </header>
  <main>
    <div id="auth">
      <input id="email" placeholder="البريد الإلكتروني" type="email" autocomplete="username" />
      <input id="password" type="password" placeholder="كلمة المرور" autocomplete="current-password" />
      <button onclick="signIn()">تسجيل الدخول</button>
      <button onclick="signUp()">إنشاء حساب</button>
    </div>
    <div id="chat" style="display:none; flex-direction: column; height: 100%;">
      <div class="welcome-message">
        <p>مرحباً، <span id="userEmail"></span>! 👋</p>
      </div>
      <div id="messages"></div>
      <div class="input-container" role="form" aria-label="إرسال رسالة">
        <input id="messageInput" placeholder="اكتب رسالة..." onkeypress="handleKeyPress(event)" aria-label="حقل كتابة الرسالة" />
        <button class="send-btn" onclick="sendMessage()" id="sendBtn" aria-label="إرسال رسالة">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </div>
    </div>
  </main>
  <footer>
    الموقع آمن بالكامل ويخضع للتشفير التام. تصميم وتنفيذ: raad alaswed © 2025
  </footer>
  <script type="module">
    // يبقى الكود كما هو بدون تغيير
  </script>
</body>
</html>
