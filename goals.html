<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأهداف المالية | مصاريفي</title>

<style>
body{margin:0;background:#0b1120;color:#e5e7eb;direction:rtl;font-family:Tahoma}
header{padding:15px;text-align:center;background:#020617;font-size:20px}
nav{display:flex;justify-content:space-around;background:#111827;padding:10px}
nav a{color:#9ca3af;text-decoration:none}
nav a.active{color:#38bdf8;font-weight:bold}
main{padding:15px}
.card{background:#1f2933;padding:15px;border-radius:14px;margin-bottom:15px}
input,button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:8px}
input{background:#020617;color:#e5e7eb}
button{background:#38bdf8;color:#020617;font-weight:bold}
progress{width:100%;height:20px}
</style>
</head>

<body>

<header>🎯 الأهداف المالية</header>

<nav>
  <a href="index.html">الرئيسية</a>
  <a href="add.html">إضافة</a>
  <a href="goals.html" class="active">الأهداف</a>
  <a href="stats.html">تحليل</a>
</nav>

<main>

<div class="card">
  <input id="name" placeholder="اسم الهدف">
  <input id="target" type="number" placeholder="المبلغ المطلوب">
  <button onclick="addGoal()">إضافة هدف</button>
</div>

<div id="goals"></div>

</main>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyC7EVNCSl48CQgIC_a8wdC5UG2tKLtNKjQ",
  authDomain: "garag-system.firebaseapp.com",
  databaseURL: "https://garag-system-default-rtdb.firebaseio.com",
  projectId: "garag-system"
});
const db = firebase.database();
const ref = db.ref("finance/goals");

function addGoal(){
  const name = document.getElementById("name").value;
  const target = Number(document.getElementById("target").value);
  if(!name || !target) return;
  ref.push({name,target,saved:0});
}

ref.on("value", snap=>{
  const box=document.getElementById("goals");
  box.innerHTML="";
  const data=snap.val();
  if(!data) return;
  Object.values(data).forEach(g=>{
    const percent=Math.min(100,(g.saved/g.target)*100||0);
    box.innerHTML+=`
      <div class="card">
        <b>${g.name}</b>
        <progress value="${percent}" max="100"></progress>
        <p>${percent.toFixed(0)}%</p>
      </div>`;
  });
});
</script>

</body>
</html>
